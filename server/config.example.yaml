# Early Edition Kids server configuration (CONTRACT.md "Runtime"). Secrets go in env vars, never here.
# Copy to config.yaml for local runs, or point EARLY_EDITION_KIDS_CONFIG at this file.
# docs/settings.md explains every setting. The server reads this file at start, so restart it after a change.
# Never put the child's name in this file: nothing here should identify them (DESIGN 6).

title: Early Edition
child_age: 8
story_count: 6
reading_wpm: 90
# The iPad reader: "pages" turns pages like the Kindle (the default), "scroll" runs the paper down one long page.
# reader_mode: pages
# Story body length in words (the writer is told this range and validation enforces it).
story_words:
  min: 120
  max: 200

topics:
  - name: Liverpool FC
    base_weight: 3
    description: "Liverpool's matches, goals and players."
    notes: "The reader's team. Aim for one Liverpool story a day when there is a suitable one: results, goals, players, the next match. Stay on the football: no transfer gossip, contract rows or refereeing arguments. A manager change is fine as plain news."
  - name: England
    base_weight: 3
    description: "The England men's team: matches, the squad and records."
    notes: "England men's national team: matches, goals, records, the squad and the manager. Men's football only."
  - name: Football
    base_weight: 3
    description: "Club football beyond Liverpool, and the favourite players."
    notes: "Club football other than Liverpool (England has its own topic). After Liverpool, the clubs the reader cares about are the rivals Arsenal, Manchester United, Manchester City, Real Madrid and Barcelona: prefer their stories over other clubs (including when they lose or change manager), but never above a suitable Liverpool story. Favour stories about the favourite players."
  - name: Science
    base_weight: 3
    description: "Discoveries, experiments and how things work."
    notes: ""
  - name: Space
    base_weight: 2
    description: "Rockets, planets and the night sky."
    notes: ""
  - name: Animals and nature
    base_weight: 2
    description: "Wildlife, pets and the natural world."
    notes: ""
  - name: Games and tech
    base_weight: 1
    description: "Video games, gadgets and robots."
    notes: ""
  - name: Weather
    base_weight: 1
    description: "Snow, storms and other big UK weather."
    notes: UK weather only when notable (snow, storms, eclipses).
  - name: Weird but true
    base_weight: 1
    description: "Odd stories that really happened."
    notes: One a day at most.

favourite_players:
  - Messi
  - Ronaldo
  - Harry Kane
  - Lamine Yamal
favourite_team: Liverpool
# The Sport page (docs/sports-page.md): the Premier League table, the latest results and the next
# fixtures, fetched once a day with the paper. favourite_team marks his club on it. Off unless set.
# sports:
#   enabled: true
# Only men's football: the prompts skip women's and girls' football. The feeds' exclude_title_patterns
# below drop the obvious headlines before selection. Leave out or set false for all football.
mens_football_only: true
rival_clubs:
  - Arsenal
  - Manchester United
  - Manchester City
  - Real Madrid
  - Barcelona

# LLM prices in US dollars per million tokens, for the dashboard's cost figures and the
# monthly limit. A model missing here is recorded at $0 and flagged in the log.
llm_prices:
  claude-opus-5-5: { input_per_mtok: 4, output_per_mtok: 20 }
  claude-sonnet-5-5: { input_per_mtok: 2, output_per_mtok: 10 }
  claude-haiku-5-5: { input_per_mtok: 0.10, output_per_mtok: 0.50 }

# Models offered through OpenRouter (needs OPENROUTER_API_KEY). Ids are OpenRouter's own; the
# dashboard offers them as "openrouter:<id>". Prices are USD per million tokens, used when
# OpenRouter does not report the cost of a call itself.
openrouter_models:
  - id: anthropic/claude-opus-5.5
    name: "Claude Opus 5.5 (OpenRouter)"
    note: "The same careful Claude Opus, billed through OpenRouter."
    input_per_mtok: 4
    output_per_mtok: 20
  - id: anthropic/claude-sonnet-5.5
    name: "Claude Sonnet 5.5 (OpenRouter)"
    note: "Nearly as good as Opus at about half the cost, through OpenRouter."
    input_per_mtok: 2
    output_per_mtok: 10
  - id: moonshotai/kimi-k3.1-pro
    name: "Kimi K3.1 Pro (OpenRouter)"
    note: "A strong model from another company; worth trying as a second opinion."
    input_per_mtok: 2
    output_per_mtok: 10
  - id: x-ai/grok-4.7
    name: "Grok 4.7 (OpenRouter)"
    note: "Another company's model; cheaper to write with, so check its stories closely."
    input_per_mtok: 2
    output_per_mtok: 6
  - id: z-ai/glm-5.3
    name: "GLM 5.3 (OpenRouter)"
    note: "Very low cost; untested for children's writing"
    input_per_mtok: 0.08
    output_per_mtok: 3.6
  - id: deepseek/deepseek-v4-pro-0813
    name: "DeepSeek V4 Pro (OpenRouter)"
    note: "Very low cost; untested for children's writing"
    input_per_mtok: 0.11
    output_per_mtok: 4.44

# Patterns are regular expressions, matched case-insensitively with re.search.
feeds:
  - name: BBC Newsround
    url: https://feeds.bbci.co.uk/newsround/rss.xml
    kids_source: true
    topic_hint: null
    exclude_url_patterns:
      - /videos/
      - watch_newsround
      - /sounds/
    exclude_title_patterns:
      - ^Quiz
      - in pictures
      - have your say
      - ^Watch Newsround
      - get in touch
      # "Have your say" prompts are phrased as a question to the reader.
      - \byou(r)?\b[^?]*\?\s*$
  - name: Science News Explores
    url: https://www.snexplores.org/feed
    kids_source: true
    topic_hint: Science
    exclude_url_patterns: []
    exclude_title_patterns:
      - ^Scientists Say
      - ^Analyze This
  - name: BBC Sport football
    url: https://feeds.bbci.co.uk/sport/football/rss.xml
    kids_source: false
    topic_hint: Football
    exclude_url_patterns:
      - /videos/
      - /sounds/
      - /live/
    exclude_title_patterns:
      - \bwom[ae]n.?s\b
      - \bWSL\b
      - Lionesses
      - \bgirls\b
      - ^Quiz
      - quizzes
      - gossip
      - ^Football Daily
      - in pictures
      # "Pick your XI" and "which was your favourite?" prompts.
      - \byou(r)?\b[^?]*\?\s*$
  - name: BBC Sport Liverpool
    url: https://feeds.bbci.co.uk/sport/football/teams/liverpool/rss.xml
    kids_source: false
    topic_hint: Liverpool FC
    exclude_url_patterns:
      - /videos/
      - /sounds/
      - /live/
    exclude_title_patterns:
      - \bwom[ae]n.?s\b
      - \bWSL\b
      - Lionesses
      - \bgirls\b
      - ^Quiz
      - quizzes
      - gossip
      - ^Football Daily
      - in pictures
      - \byou(r)?\b[^?]*\?\s*$
  - name: BBC Sport England
    url: https://feeds.bbci.co.uk/sport/football/teams/england/rss.xml
    kids_source: false
    topic_hint: England
    exclude_url_patterns:
      - /videos/
      - /sounds/
      - /live/
    exclude_title_patterns:
      - \bwom[ae]n.?s\b
      - \bWSL\b
      - Lionesses
      - \bgirls\b
      - ^Quiz
      - quizzes
      - gossip
      - ^Football Daily
      - in pictures
      - \byou(r)?\b[^?]*\?\s*$
  - name: BBC science
    url: https://feeds.bbci.co.uk/news/science_and_environment/rss.xml
    kids_source: false
    topic_hint: Science
    exclude_url_patterns:
      - /videos/
      - /sounds/
      - /live/
    exclude_title_patterns:
      - in pictures
      - ^BBC Inside Science
      - \byou(r)?\b[^?]*\?\s*$

# Whole words or phrases, case-insensitive. Matching rejects a feed item before selection
# and rejects a finished story. Keep it short and blunt; the LLM checker does the nuance.
blocklist:
  - war
  - wars
  - warfare
  - terror
  - terrorist
  - terrorism
  - bomb
  - bombing
  - missile
  - drone strike
  - airstrike
  - gun
  - guns
  - shooting
  - shot dead
  - stabbing
  - stabbed
  - knife
  - murder
  - murdered
  - kill
  - killed
  - killing
  - dead
  - death
  - deaths
  - died
  - dies
  - fatal
  - suicide
  - abuse
  - abused
  - assault
  - rape
  - sexual
  - sex
  - porn
  - gambling
  - betting
  - bookmaker
  - casino
  - drugs
  - cocaine
  - sacked
  - sacking
  - brain-eating

# More than one child? Give each a profile. Every profile has its own paper, Kindle address,
# reading history, dashboard and AI settings. An id is lowercase letters, digits and hyphens; use
# something neutral like these, never a name. A profile may override any setting above (child_age,
# story_count, reading_wpm, reader_mode, story_words, title, topics, feeds, blocklist, favourite_players,
# favourite_team, rival_clubs, mens_football_only, sports, ...); a list replaces the one above rather than
# adding to it. llm_prices and openrouter_models are shared by all.
# The first profile listed the first time keeps the existing paper and Kindle address (recorded in
# $EARLY_EDITION_KIDS_DATA_DIR/profiles.json), so list the child who already reads it first. Every
# other Kindle's server address ends in /p/<id>, for example http://192.168.1.50:8080/p/younger.
# profiles:
#   - id: older
#   - id: younger
#     child_age: 6
#     story_count: 4
#     title: Little Edition
#     story_words: { min: 80, max: 130 }
#     reader_mode: scroll
