# One-off model comparison (server/scripts/compare-models.ts). Writes nothing to the live database:
# it uses an emptyDir and its own temp files, and publishes nothing. Run with:
#   kubectl -n my-apps delete job early-edition-kids-compare --ignore-not-found
#   kubectl apply -f deploy/k8s/compare-job.yaml
#   kubectl -n my-apps logs job/early-edition-kids-compare \
#     | grep '^COMPARE_RESULT_JSON ' | cut -d' ' -f2- > reports/model-comparison.json
apiVersion: batch/v1
kind: Job
metadata:
  name: early-edition-kids-compare
  namespace: my-apps
  labels:
    app.kubernetes.io/name: early-edition-kids
    app.kubernetes.io/instance: early-edition-kids
    app.kubernetes.io/component: compare
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: early-edition-kids
        app.kubernetes.io/component: compare
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: compare
          image: registry.gitlab.com/kris-g/early-edition-kids:compare
          imagePullPolicy: Always
          env:
            - name: EARLY_EDITION_KIDS_CONFIG
              value: /config/config.yaml
            - name: EARLY_EDITION_KIDS_DATA_DIR
              value: /data
            - name: TMPDIR
              value: /data
            # Always the real providers: never the stub, whatever the main secret says.
            - name: LLM_BASE_URL
              value: ""
            - name: LLM_PROVIDER
              value: anthropic
            - name: COMPARE_DATE
              value: "2026-11-09"
            - name: COMPARE_WRITERS
              value: anthropic:claude-opus-5-5,anthropic:claude-sonnet-5-5,openrouter:z-ai/glm-5.3,openrouter:deepseek/deepseek-v4-pro-0813
            - name: COMPARE_CHECKER
              value: anthropic:claude-opus-5-5
            # Stop starting new LLM calls once this much (USD) has been spent.
            - name: COMPARE_BUDGET_USD
              value: "1.5"
            - name: COMPARE_FORMAT
              value: marker
            # One slow model must not stall the run: each call times out after 4 minutes (one retry),
            # and no new call starts after 20 minutes, so results always print before the deadline.
            - name: COMPARE_CALL_TIMEOUT_SECONDS
              value: "240"
            - name: COMPARE_DEADLINE_SECONDS
              value: "1200"
          envFrom:
            - secretRef:
                name: early-edition-kids-secrets
            - secretRef:
                name: early-edition-kids-llm-key
                optional: true
            - secretRef:
                name: early-edition-kids-openrouter-key
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: early-edition-kids-config
