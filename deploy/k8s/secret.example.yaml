# Template only. Copy to secret.yaml (gitignored), fill in, and apply.
# Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: early-edition-kids-secrets
  namespace: my-apps
  labels:
    app.kubernetes.io/name: early-edition-kids
    app.kubernetes.io/instance: early-edition-kids
type: Opaque
stringData:
  # Two providers can be set up side by side; the writer and the checker each pick a model from either
  # (changeable later in the dashboard's AI settings, which override the values here):
  #   Anthropic: the API key is LLM_API_KEY, in its own Secret early-edition-kids-llm-key.
  #   OpenRouter: the API key is OPENROUTER_API_KEY, in its own Secret early-edition-kids-openrouter-key.
  # Both Secrets are optional and created by hand (see deployment.yml); a provider without a key
  # shows as "not set up" and its models can't be chosen.
  # Back-compat: LLM_PROVIDER: openai with LLM_BASE_URL uses one generic OpenAI-compatible endpoint
  # instead. Set LLM_BASE_URL: stub to run with canned stories and no LLM.
  LLM_PROVIDER: anthropic
  # Models are namespaced: anthropic:claude-opus-5-5, openrouter:moonshotai/kimi-k3.1-pro, ...
  # (a bare id means anthropic:).
  LLM_MODEL: anthropic:claude-opus-5-5
  # Optional: a different model for the checker call. Delete the line to use LLM_MODEL.
  CHECK_LLM_MODEL: anthropic:claude-opus-5-5
  # Optional: how hard the model thinks (Anthropic effort, OpenRouter reasoning effort). low | medium | high.
  # Defaults: medium for choosing and writing, high for the safety and fact check.
  # LLM_EFFORT: medium
  # CHECK_LLM_EFFORT: high
  # Shared by the server and the CronJob (sent as X-Admin-Token).
  ADMIN_TOKEN: REPLACE_ME
  # No dashboard password: the dashboard has no login of its own; Authelia guards it at the edge.
