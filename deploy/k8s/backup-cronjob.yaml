# Nightly consistent copy of early-edition-kids.db to the NAS, kept 30 days.
# With several profiles, each extra profile's database is copied too, as
# early-edition-kids-YYYY-MM-DD.<id>.db.
# Uses the app image's own backup script (SQLite VACUUM INTO, safe while the
# server runs). The data volume is local-path on one node, so this pod is
# scheduled there automatically by the volume's node affinity.
#
# Restore: scale the Deployment to 0, copy the chosen
#   early-edition-kids-YYYY-MM-DD.db over /data/early-edition-kids.db
#   (and delete any -wal/-shm files beside it), then scale back to 1. A profile's
#   early-edition-kids-YYYY-MM-DD.<id>.db goes to /data/profiles/<id>/early-edition-kids.db.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: early-edition-kids-backup
  namespace: my-apps
  labels:
    app.kubernetes.io/name: early-edition-kids
    app.kubernetes.io/instance: early-edition-kids
spec:
  schedule: "15 2 * * *"
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: early-edition-kids-backup
            app.kubernetes.io/instance: early-edition-kids
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: registry.gitlab.com/kris-g/early-edition-kids:latest
              imagePullPolicy: Always
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  f="/backup/early-edition-kids-$(date +%F).db"
                  rm -f "$f" "/backup/early-edition-kids-$(date +%F)".*.db
                  node --import tsx src/backup.ts "$f"
                  find /backup -name 'early-edition-kids-*.db' -mtime +30 -delete
                  ls -l /backup | tail -n 5
              env:
                - name: EARLY_EDITION_KIDS_DATA_DIR
                  value: /data
                - name: TZ
                  value: Europe/London
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backup
                  mountPath: /backup
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: early-edition-kids-pvc
            - name: backup
              persistentVolumeClaim:
                claimName: early-edition-kids-backup-pvc
