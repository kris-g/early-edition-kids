# Builds the server image for linux/amd64 and linux/arm64 and pushes it to this
# project's registry. Name the GitLab project kris-g/early-edition-kids so that
# CI_REGISTRY_IMAGE is registry.gitlab.com/kris-g/early-edition-kids.

variables:
  # docker build vars
  DOCKER_DRIVER: overlay2
  BUILDX_VERSION: "v0.19.3"
  BUILDX_ARCH: "linux-amd64"

stages:
  - publish

services:
  - name: docker:27.4.1-dind

publish:
  stage: publish
  image: docker:27.4.1
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - server/**/*
        - web/**/*
        - .dockerignore
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  before_script:
    - wget -O /usr/bin/docker-buildx
      https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.${BUILDX_ARCH}
    - chmod +x /usr/bin/docker-buildx
    - docker-buildx version
    - docker info
    # QEMU handlers so the amd64 runner can run the arm64 build steps.
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

  script:
    - docker-buildx create --use
    - TAG_ARGS="-t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then TAG_ARGS="$TAG_ARGS -t ${CI_REGISTRY_IMAGE}:latest"; fi
    - if [ -n "$CI_COMMIT_TAG" ]; then TAG_ARGS="$TAG_ARGS -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"; fi
    - docker-buildx build
      --platform linux/amd64,linux/arm64
      $TAG_ARGS
      -f ./server/Dockerfile
      --push
      .
